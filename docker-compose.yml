version: "3.3"

services:
  web:
    build: .
    command: gunicorn beermat_site.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - /home/marian/projects_data/beermat/media:/app/media
      - /home/marian/projects_data/beermat/static:/app/static
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: beermat
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sqeu2-sqeu2
    volumes:
      - /home/marian/projects_data/beermat/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /home/marian/projects_data/beermat/static:/app/static
      - /home/marian/projects_data/beermat/media:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
